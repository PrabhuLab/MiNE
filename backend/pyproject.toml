[project]
name = "mine-igraph-backend"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.116.1",
  "igraph==0.11.9",
  "orjson==3.11.1",
  "pydantic-settings==2.10.1",
  "sparsebm==1.6.7",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==8.4.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
